<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>claude-chat</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --me:#238636; --ai:#21262d; --tool:#1f2a44; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; background:var(--panel); border-bottom:1px solid #30363d;
    font-size:14px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  header b { color:var(--text); }
  #conn { cursor:pointer; user-select:none; }
  #conn:active { opacity:.6; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .bubble { position:relative; max-width:88%; padding:10px 13px; border-radius:14px; white-space:pre-wrap;
    word-break:break-word; overflow-wrap:anywhere;
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; cursor:default; }
  /* 复制成功的短暂反馈角标 */
  .bubble.copied::after { content:'已复制 ✓'; position:absolute; top:-9px; right:8px;
    background:#2ea043; color:#fff; font-size:11px; padding:1px 6px; border-radius:8px; }
  .bubble.copied { outline:2px solid #2ea043; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--ai); border-bottom-left-radius:4px; }
  .tool { align-self:flex-start; background:var(--tool); color:#a9c7ff; font-size:14px;
    border-radius:10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .tool-title { word-break:break-word; overflow-wrap:anywhere; }
  .tool-title.tappable { cursor:pointer; }
  .tool-title.tappable::before { content:'▸ '; color:#6e7681; }
  .tool-detail { margin:8px 0 0; padding:8px; background:#0d1117; border-radius:8px;
    font-size:12px; line-height:1.4; color:#c9d1d9; white-space:pre-wrap; word-break:break-word;
    overflow-wrap:anywhere; max-height:40vh; overflow-y:auto; }
  .ask { align-self:stretch; background:#1c2333; border:1px solid #30506e; border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:12px; }
  .ask-q { font-size:15px; font-weight:600; color:#e6edf3; word-break:break-word; }
  .ask-hint { font-size:12px; color:var(--muted); margin-top:-6px; }
  .ask-opts { display:flex; flex-wrap:wrap; gap:8px; }
  .ask-opt { text-align:left; background:#0d1117; color:#e6edf3; border:1px solid #30363d;
    border-radius:16px; padding:7px 14px; font-size:14px; line-height:1.2; cursor:pointer;
    font-family:inherit; -webkit-tap-highlight-color:transparent; }
  .ask-opt .lbl { font-weight:600; }
  .ask-opt.sel { border-color:#2ea043; background:#132a1b; }
  .ask-opt.sel .lbl::before { content:'✓ '; color:#2ea043; }
  .ask-send { align-self:flex-end; background:#2ea043; color:#fff; border:none; border-radius:10px;
    padding:9px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .ask-send:disabled { opacity:.5; }
  .ask.answered { opacity:.6; }
  .ask.answered .ask-opt, .ask.answered .ask-send { pointer-events:none; }
  .status { align-self:center; color:var(--muted); font-size:13px; }
  .ai pre, .ai code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  form { display:flex; gap:8px; padding:10px; background:var(--panel); border-top:1px solid #30363d;
    padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  /* iOS Safari 聚焦 <16px 的输入框会自动放大页面。已用 viewport 的 maximum-scale=1,
     user-scalable=no 锁死缩放，所以这里可以用 14px（锁缩放后 iOS 不再触发聚焦放大）。
     若个别 iOS 版本仍放大，把这里改回 16px 最稳。 */
  textarea { flex:1; resize:none; border:1px solid #30363d; border-radius:10px; background:var(--bg);
    color:var(--text); padding:9px 12px; font-size:14px; line-height:1.4;
    font-family:inherit; max-height:120px; }
  button { border:0; border-radius:10px; background:var(--me); color:#fff; padding:0 18px;
    font-size:16px; font-weight:600; }
  button:disabled { opacity:.4; }
</style>
</head>
<body>
<div id="app">
  <header><span>💬 <b>claude-chat</b> <small style="color:#6e7681">·长按气泡复制</small></span><span id="conn" title="点我刷新到最新">连接中…</span></header>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" rows="1" placeholder="发消息给 Claude…" autocomplete="off"></textarea>
    <button id="b" type="submit">发送</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const conn = document.getElementById('conn');
const form = document.getElementById('f');
const ta = document.getElementById('t');
const btn = document.getElementById('b');

let aiBubble = null;      // 当前正在追加文本的 AI 气泡
let statusEl = null;      // "思考中…" 之类
// tool_start 立占位气泡入队；tool_use（同名，FIFO）来时取队首更新。
// 为什么用队列：一轮里可能连开多个工具，stream 先一串 tool_start，
// 完整参数随后由 assistant 消息一次性发一串 tool_use——按名字先进先出配对最稳。
let toolPending = [];

function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
function scroll() { log.scrollTop = log.scrollHeight; }
function addBubble(cls, text='') {
  const stick = atBottom();
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  if (cls === 'me' || cls === 'ai' || cls === 'tool') enableCopy(d);
  log.appendChild(d);
  if (stick) scroll();
  return d;
}
function clearStatus() { if (statusEl) { statusEl.remove(); statusEl = null; } }

// 渲染一条完整工具调用：标题行「🔧 工具名 · 摘要」+ 可点开的完整参数（JSON）。
// bubble 传 tool_start 立的占位就复用它（更新内容），传 null 就新建一条。
function renderTool(bubble, msg) {
  const stick = atBottom();
  const el = bubble || (() => { const d = document.createElement('div'); d.className = 'bubble tool'; log.appendChild(d); return d; })();
  el.textContent = '';                       // 清掉占位的 "… "
  const title = document.createElement('div');
  title.className = 'tool-title';
  title.textContent = '🔧 ' + msg.name + (msg.summary ? ' · ' + msg.summary : '');
  el.appendChild(title);
  // 有参数就挂一个可点开的详情（默认收起，点标题切换）。
  const input = msg.input && Object.keys(msg.input).length ? msg.input : null;
  if (input) {
    const detail = document.createElement('pre');
    detail.className = 'tool-detail';
    try { detail.textContent = JSON.stringify(input, null, 2); }
    catch { detail.textContent = String(input); }
    detail.style.display = 'none';
    el.appendChild(detail);
    title.classList.add('tappable');
    title.addEventListener('click', () => {
      detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
    });
  }
  enableCopy(el);
  if (stick) scroll();
  return el;
}

// 渲染 AskUserQuestion：每个问题一组可点选项按钮 + 一个"发送选择"按钮。
// 单选点一下即选中（互斥）；多选可选多个。点发送 → POST /answer。
function renderAsk(msg) {
  const stick = atBottom();
  const el = document.createElement('div');
  el.className = 'bubble ask';
  el.dataset.askId = msg.id;
  const questions = Array.isArray(msg.questions) ? msg.questions : [];
  // picks[i] = 第 i 题选中的 label 集合
  const picks = questions.map(() => new Set());

  questions.forEach((q, qi) => {
    const multi = !!q.multiSelect;
    const qEl = document.createElement('div'); qEl.className = 'ask-q'; qEl.textContent = q.question || '';
    el.appendChild(qEl);
    if (multi) { const h = document.createElement('div'); h.className='ask-hint'; h.textContent='（可多选）'; el.appendChild(h); }
    const opts = document.createElement('div'); opts.className = 'ask-opts';
    (q.options || []).forEach((o) => {
      const label = typeof o === 'string' ? o : (o.label || '');
      const desc = typeof o === 'string' ? '' : (o.description || '');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ask-opt';
      const l = document.createElement('span'); l.className='lbl'; l.textContent = label; b.appendChild(l);
      // 描述放 title（长按/悬停可见），不占按钮高度，保持按钮短小。
      if (desc) b.title = desc;
      b.addEventListener('click', () => {
        if (multi) {
          if (picks[qi].has(label)) { picks[qi].delete(label); b.classList.remove('sel'); }
          else { picks[qi].add(label); b.classList.add('sel'); }
        } else {
          picks[qi].clear(); picks[qi].add(label);
          opts.querySelectorAll('.ask-opt').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
        }
        sendBtn.disabled = picks.some(s => s.size === 0);
      });
      opts.appendChild(b);
    });
    el.appendChild(opts);
  });

  const sendBtn = document.createElement('button');
  sendBtn.type = 'button'; sendBtn.className = 'ask-send'; sendBtn.textContent = '发送选择';
  sendBtn.disabled = true;   // 每题都选了才能发
  sendBtn.addEventListener('click', async () => {
    sendBtn.disabled = true; sendBtn.textContent = '提交中…';
    const body = { id: msg.id, picks: picks.map(s => [...s]) };
    try {
      const r = await fetch(BASE + 'answer', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      el.classList.add('answered');   // 灰掉、锁住；服务端会广播 ask_answered/user 回显
    } catch { sendBtn.disabled = false; sendBtn.textContent = '发送选择（重试）'; }
  });
  el.appendChild(sendBtn);

  log.appendChild(el);
  if (stick) scroll();
  return el;
}

// 复制整条气泡内容到剪贴板，成功后短暂显示"已复制 ✓"
async function copyBubble(el) {
  const text = el.textContent || '';
  if (!text) return;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // 兜底：老浏览器 / 非安全上下文
      const t = document.createElement('textarea');
      t.value = text; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1200);
  } catch {
    el.classList.add('copied');   // 至少给个反馈
    setTimeout(() => el.classList.remove('copied'), 1200);
  }
}

// 长按（触摸)或双击（桌面）复制整条；不影响手指拖动选择部分文本。
function enableCopy(el) {
  if (el._copyBound) return;   // 防重复绑定（工具气泡可能被 addBubble + renderTool 各绑一次）
  el._copyBound = true;
  let timer = null, sx = 0, sy = 0, moved = false;
  el.addEventListener('touchstart', (e) => {
    moved = false;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => { if (!moved) copyBubble(el); }, 500);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) { moved = true; clearTimeout(timer); }
  }, { passive: true });
  el.addEventListener('touchend', () => clearTimeout(timer));
  el.addEventListener('dblclick', () => copyBubble(el));   // 桌面双击复制
}

// ── 往前翻加载更早历史（滑到顶自动拉上一页）──────────────────────────────
// 游标 histBefore = 服务端 HISTORY_CACHE 里"当前已显示最早那条"的下标；
// null 表示还没铺过历史（用服务端默认）。histHasMore=false 表示已到最顶、别再拉。
let histBefore = null, histHasMore = true, histLoading = false;

// 把一条历史事件渲染成一个"脱离文档"的气泡元素（不 append 到底部，供 prepend 用）。
// readHistory 只产出 user / ai / tool_use 三种，这里对齐它们的样式。
function buildOlderBubble(msg) {
  if (msg.type === 'tool_use') {
    const d = document.createElement('div'); d.className = 'bubble tool';
    const title = document.createElement('div'); title.className = 'tool-title';
    title.textContent = '🔧 ' + msg.name + (msg.summary ? ' · ' + msg.summary : '');
    d.appendChild(title);
    const input = msg.input && Object.keys(msg.input).length ? msg.input : null;
    if (input) {
      const detail = document.createElement('pre'); detail.className = 'tool-detail';
      try { detail.textContent = JSON.stringify(input, null, 2); } catch { detail.textContent = String(input); }
      detail.style.display = 'none'; d.appendChild(detail);
      title.classList.add('tappable');
      title.addEventListener('click', () => { detail.style.display = detail.style.display === 'none' ? 'block' : 'none'; });
    }
    enableCopy(d); return d;
  }
  const cls = msg.type === 'user' ? 'me' : 'ai';
  const d = document.createElement('div'); d.className = 'bubble ' + cls; d.textContent = msg.text || '';
  enableCopy(d); return d;
}

async function loadOlder() {
  if (histLoading || !histHasMore) return;
  histLoading = true;
  try {
    const q = histBefore == null ? '' : ('?before=' + histBefore);
    const r = await fetch(BASE + 'history' + q, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const evs = data.events || [];
    if (evs.length) {
      // 保持滚动位置不跳：prepend 前记高度，prepend 后按差值补回 scrollTop。
      const before = log.scrollHeight, prevTop = log.scrollTop;
      const frag = document.createDocumentFragment();
      for (const ev of evs) frag.appendChild(buildOlderBubble(ev));   // evs 是时间正序
      log.insertBefore(frag, log.firstChild);
      log.scrollTop = prevTop + (log.scrollHeight - before);
    }
    histBefore = data.before;
    histHasMore = !!data.hasMore;
  } catch {
    // 静默失败，下次滑到顶再试
  } finally {
    histLoading = false;
  }
}

// 滑到接近顶部时自动拉上一页。
log.addEventListener('scroll', () => { if (log.scrollTop < 60) loadOlder(); }, { passive: true });

function handle(msg) {
  switch (msg.type) {
    case 'hello':
      conn.textContent = msg.sessionId ? '已连接' : '已连接·新会话';
      break;
    case 'session':
      conn.textContent = '会话 ' + msg.sessionId.slice(0, 8);
      break;
    case 'history_start':
      // 清空当前所有气泡，重新铺历史（防重连重复）
      log.innerHTML = ''; aiBubble = null; statusEl = null; toolPending = [];
      // 重置往前翻的游标：这次首屏铺的是最近一页，更早的等滑到顶再拉。
      histBefore = null; histHasMore = (msg.truncated !== false); histLoading = false;
      break;
    case 'ai':
      // 历史里的整条 AI 文字（不是增量）
      clearStatus(); aiBubble = null;
      addBubble('ai', msg.text);
      break;
    case 'history_end':
      addBubble('status', '⎯⎯ 以上为历史 · 下面继续 ⎯⎯');
      scroll();
      break;
    case 'user':
      clearStatus(); aiBubble = null;
      addBubble('me', msg.text);
      break;
    case 'status':
      clearStatus();
      statusEl = addBubble('status', msg.text);
      break;
    case 'tool_start':
      // stream 里工具刚开始时参数还没到（input 是空的），先立一条占位气泡入队，
      // 等下面的 tool_use（带完整参数+摘要）来更新它，避免出现两条重复的工具气泡。
      clearStatus(); aiBubble = null;
      toolPending.push({ name: msg.name, el: addBubble('tool', '🔧 ' + msg.name + ' …') });
      break;
    case 'tool_use': {
      // 完整工具调用：有摘要 + 完整参数。按名字从占位队列取一个更新；
      // 没有匹配占位（历史回放/兜底路径）就新建一条。
      clearStatus(); aiBubble = null;
      let bubble = null;
      const idx = toolPending.findIndex(p => p.name === msg.name);
      if (idx >= 0) { bubble = toolPending[idx].el; toolPending.splice(idx, 1); }
      renderTool(bubble, msg);
      break;
    }
    case 'ask':
      // Claude 在问选择题——渲染成可点选项。若已存在同 id 的（重连重放）先不重复加。
      clearStatus(); aiBubble = null;
      if (!log.querySelector('.ask[data-ask-id="' + msg.id + '"]')) renderAsk(msg);
      break;
    case 'ask_answered': {
      // 已回答（可能是别的端答的/重放）——把对应问题卡片锁住变灰。
      const a = log.querySelector('.ask[data-ask-id="' + msg.id + '"]');
      if (a) a.classList.add('answered');
      break;
    }
    case 'ask_clear': {
      // 这一轮结束还没答（中断/报错）——撤下按钮，锁住。
      const a = log.querySelector('.ask[data-ask-id="' + msg.id + '"]');
      if (a) a.classList.add('answered');
      break;
    }
    case 'text_delta':
      clearStatus();
      if (!aiBubble) aiBubble = addBubble('ai', '');
      { const stick = atBottom(); aiBubble.textContent += msg.text; if (stick) scroll(); }
      break;
    case 'block_stop':
      aiBubble = null;      // 下一段文字另起气泡
      break;
    case 'done':
      clearStatus(); aiBubble = null; toolPending = []; setBusy(false);
      break;
    case 'error':
      clearStatus(); aiBubble = null; setBusy(false);
      addBubble('status', '⚠️ ' + msg.message);
      break;
  }
}

// 生成中不禁用发送按钮——像 CLI 那样随时插话。
// 按钮文案同时兼当"忙闲指示"，让手机一眼看出 agent 说完没：
//   空闲（这轮说完了）        → "发送"（不管输入框空不空）
//   在跑 + 输入框有字         → "排队"（把消息排进 agent 当前内部轮次，保留上下文接着处理，像真实 Claude）
//   在跑 + 输入框空           → "打断"（点了就掐断当前轮、丢弃在途工作）
let busy = false;   // = agent 正在跑（服务端 running）。由 poll() 的 running 和事件共同维护。
function setBusy(b) { busy = b; refreshBtn(); }
function refreshBtn() { btn.textContent = !busy ? '发送' : (ta.value.trim() ? '排队' : '打断'); }

// 关键：不靠"相对路径 + 尾斜杠"。手机地址栏可能吃掉末尾的 /，导致 EventSource('stream')
// 掉了 /<secret> 前缀撞 404、SSE 根本连不上（发送成功但收不到回复）。
// 这里显式用当前路径去掉末尾 index.html / 尾斜杠后的目录，拼出绝对 URL。
const BASE = (() => {
  let p = location.pathname.replace(/\/index\.html$/, '');
  if (!p.endsWith('/')) p += '/';
  return location.origin + p;   // 例：https://host/<secret>/
})();

// 轮询取事件（不用 SSE）：某些网络（公司 TLS 中间人代理）会缓冲流式响应，把 SSE 长连接
// 整个憋死——首页短请求能过，发消息后却一个字都收不到。改成每秒拉一次 /events?since=<seq>：
// 短请求能稳穿代理。since 记着已收到的最大 seq，只取增量。
let lastSeq = 0, polling = false, pollTimer = null, failStreak = 0;

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch(BASE + 'events?since=' + lastSeq, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    conn.textContent = '已连接';
    failStreak = 0;
    for (const ev of (data.events || [])) {
      if (ev.seq > lastSeq) lastSeq = ev.seq;
      handle(ev);
    }
    // 忙闲以服务端 running 为准（跨刷新/多端/后台切回都对）：驱动发送按钮文案。
    if (typeof data.running === 'boolean' && data.running !== busy) setBusy(data.running);
  } catch {
    failStreak++;
    conn.textContent = failStreak > 2 ? '连接中…' : '已连接';
  } finally {
    polling = false;
  }
}
// 每秒一拉；页面在前台才拉，后台省电（切回来立即补一拉）
function startPolling() {
  if (pollTimer) return;
  poll();
  pollTimer = setInterval(() => { if (!document.hidden) poll(); }, 1000);
}
startPolling();
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
// 点右上角状态 = 手动刷新：从头重拉一遍（重读 jsonl 历史 + 最新对话）。
// 电脑 CLI 后续写进 jsonl 的新内容，靠这个从头拉过来。
conn.addEventListener('click', () => { conn.textContent = '刷新中…'; lastSeq = 0; log.innerHTML=''; aiBubble=null; statusEl=null; toolPending=[]; histBefore=null; histHasMore=true; histLoading=false; poll(); });

// 有文字 = 排队到 agent 当前内部轮次（忙时）/ 正常开一轮（闲时），保留上下文不打断；
// 空白（空/仅空格）= 打断当前轮、丢弃在途工作。mode 由内容决定，具体动作在 server 端。
async function send() {
  const text = ta.value.trim();
  // 若正挂着未回答的选框：打字发送=直接把这段文字当成对选框的回答（贴近真实 CLI），
  // 空发送则忽略（别误触打断把选框那轮掐掉）。服务端 /send 也有同样的兜底。
  const pendingAskEl = log.querySelector('.ask:not(.answered)');
  if (pendingAskEl) {
    ta.value = ''; ta.style.height = 'auto'; refreshBtn();
    if (!text) return;   // 选框期空发送忽略
    const id = pendingAskEl.dataset.askId;
    pendingAskEl.classList.add('answered');   // 立即锁住选框；服务端会广播 ask_answered/user 回显
    try {
      await fetch(BASE + 'answer', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ id, picks: [[text]] }) });   // 自由文字回答
    } catch { addBubble('status','⚠️ 发送失败'); }
    return;
  }
  const mode = text ? 'queue' : 'interrupt';
  ta.value = ''; ta.style.height = 'auto'; refreshBtn();
  try {
    if (mode === 'queue') setBusy(true);
    // 排队/打断由 server 按 mode 处理；用户气泡也由 server 回显（排队即显示）。
    await fetch(BASE + 'send', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ text, mode }) });
  } catch { setBusy(false); addBubble('status','⚠️ 发送失败'); }
}

form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
// 手机上回车换行、点发送按钮提交；桌面 Enter 发送、Shift+Enter 换行
ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) {
    e.preventDefault(); send();
  }
});
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; refreshBtn(); });
refreshBtn();   // 初始 busy=false → 显示"发送"；首个 poll 的 running 会立即校准
</script>
</body>
</html>
